services:
  lantern:
    build: .
    # Host networking lets a scan read the host ARP cache and reach hosts
    # on the LAN. It does not publish the dashboard. The image command
    # binds 127.0.0.1:8068, which on the host network is the host's own
    # loopback. Open http://127.0.0.1:8068/ on the host. Do not add a
    # ports: mapping; with host networking it would not do what you expect,
    # and the dashboard must not be reachable from the LAN by default.
    #
    # Opting in to a LAN bind is not recommended. Prefer an SSH tunnel or
    # Tailscale to 127.0.0.1. Strict auth is the default, so the container needs a token: mount a regular token file
    # mode 0400 owned by uid 10001. Do not use a symlink. Mode 0444 is
    # refused: this file's mode is mounted as-is. Do not write the token
    # into this file.
    # Docker has no terminal, so Lantern will not print a token into
    # `docker logs`. Without the file or LANTERN_API_TOKEN the command
    # exits 2 and does not listen. --host 0.0.0.0 also needs --allow-host
    # set to the LAN address clients will send. That address is the Host
    # allowlist entry; 0.0.0.0 itself is not added.
    #   command:
    #     - lantern
    #     - web
    #     - --host
    #     - 0.0.0.0
    #     - --port
    #     - "8068"
    #     - --db
    #     - /data/lantern.db
    #     - --allow-lan
    #     - --allow-host
    #     - 192.168.1.50
    #   environment:
    #     LANTERN_API_TOKEN_FILE: /run/secrets/lantern_token
    #   secrets:
    #     - lantern_token
    # Do not add a ports: key. Host networking does not publish ports that
    # way. If you ever switch this service to a bridge network, publish
    # loopback on the host only: "127.0.0.1:8068:8068". Never expose 8068
    # to the internet.
    network_mode: "host"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    # ICMP ping is not installed in this image. TCP connect scans and the
    # host ARP cache work with every capability dropped. If a derived image
    # adds a ping binary, this is the only capability to add back:
    # cap_add:
    #   - NET_RAW
    security_opt:
      - no-new-privileges:true
    volumes:
      # Create this directory before `docker compose up` and give it to
      # the container user (chown needs root):
      #   mkdir -p data && sudo chown 10001:10001 data && sudo chmod 700 data
      - ./data:/data
    restart: "on-failure:3"

# Top-level secret definition. Uncomment this with the service `secrets:`
# list above. It stays at column 0 so the uncommented key is not nested.
# secrets:
#   lantern_token:
#     file: ./lantern_token
