name: Refresh MAC vendor table

# Once a month, rebuild lantern/data/oui.tsv.gz from the IEEE public
# listing and open a pull request when a prefix was added, removed, or
# renamed. Lantern itself never downloads this data; it ships in releases.
# Opening the PR needs "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General). Without it the job still
# builds the table and fails at the PR step, so the change is visible.
# A PR opened with the workflow token does not start other workflows, so
# this job dispatches CI and the Windows package build on the PR branch;
# their results show as checks on the PR.

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

concurrency:
  group: oui-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # actions: write is only so this job can start CI on the pull request
      # it opens. The workflow token does not start workflows on its own
      # pull requests. No other permission was added.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Rebuild the table from IEEE
        run: |
          cp lantern/data/oui.tsv.gz "$RUNNER_TEMP/old.tsv.gz"
          python tools/update_oui.py

      - name: Compare (ignoring the fetch-date header)
        id: compare
        run: |
          python - "$RUNNER_TEMP/old.tsv.gz" lantern/data/oui.tsv.gz <<'EOF' >> "$GITHUB_OUTPUT"
          import gzip, sys
          def rows(path):
              lines = gzip.decompress(open(path, "rb").read()).decode().splitlines()
              return {line for line in lines if not line.startswith("#")}
          old, new = rows(sys.argv[1]), rows(sys.argv[2])
          print(f"changed={'true' if old != new else 'false'}")
          print(f"added={len(new - old)}")
          print(f"removed={len(old - new)}")
          EOF

      - name: Open a pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.compare.outputs.added }}
          REMOVED: ${{ steps.compare.outputs.removed }}
        run: |
          # One branch per run, including a re-run of the same run.
          # A later month does not overwrite an open pull request.
          branch="oui-refresh/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add lantern/data/oui.tsv.gz
          git commit -m "Refresh the MAC vendor table from the IEEE listing"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push origin "HEAD:refs/heads/${branch}"
          gh pr create --head "$branch" --title "Refresh the MAC vendor table ($(date -u +%Y-%m-%d))" \
            --body "Rebuild of \`lantern/data/oui.tsv.gz\` from the IEEE Registration Authority public listing by \`tools/update_oui.py\`. ${ADDED} line(s) added or changed, ${REMOVED} removed or changed. Review the diff before merging. This pull request is not set to auto-merge."
          gh workflow run ci.yml --ref "$branch"
          gh workflow run windows-package.yml --ref "$branch"
