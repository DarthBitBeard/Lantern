name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Pull requests opened by a workflow (the monthly vendor-table refresh)
  # do not trigger other workflows, so that job starts this one by hand.
  workflow_dispatch:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Linux, macOS, and Windows, on every supported Python.
# The package job builds a wheel and installs it outside the source tree.
# Nothing here scans a network: tests and the demo use local data only.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run ruff
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r .github/requirements-lint.txt
          ruff check .

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -W error tests/run_tests.py
      - name: Check demo report builds
        run: python -m lantern demo --db "$RUNNER_TEMP/lantern-ci.db"

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r .github/requirements-build.txt
          python -m build --no-isolation
          ls -1 dist/*.whl dist/*.tar.gz
      - name: Install the wheel and smoke-test outside the source tree
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          # Confirm the installed package, not the checkout, is what runs.
          python -c "from pathlib import Path; import lantern.webapp as w; assert (w.WEB_DIR / 'index.html').is_file()"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmd=(lantern.exe)
          else
            cmd=(lantern)
          fi
          "${cmd[@]}" --version
          "${cmd[@]}" demo --db "$RUNNER_TEMP/lantern-pkg.db"
          test -f "$RUNNER_TEMP/demo-report.html"
      - name: Checksums and SBOM
        run: |
          set -euo pipefail
          python tools/release_manifest.py --out dist dist/*.whl dist/*.tar.gz
          python tools/release_manifest.py --out dist --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lantern-manifest-${{ matrix.os }}
          # The wheel and sdist sit beside SHA256SUMS. The names in that
          # file are bare, so sha256sum -c only works in this one folder.
          path: dist/
          if-no-files-found: error
          retention-days: 30
