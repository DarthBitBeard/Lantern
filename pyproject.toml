[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern"
dynamic = ["version"]
description = "Local-first home network scanner: find devices, flag risky open ports, and show what changed since the last scan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["network", "scanner", "security", "homelab", "lan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DarthBitBeard/Lantern"
Repository = "https://github.com/DarthBitBeard/Lantern"
Issues = "https://github.com/DarthBitBeard/Lantern/issues"

[project.scripts]
lantern = "lantern.cli:main"

[tool.setuptools.packages.find]
include = ["lantern*"]

# Dashboard HTML/CSS/JS must ship with the package. Without this, `pip install`
# and the Docker image serve a 404 for the UI even though the API still starts.
[tool.setuptools.package-data]
lantern = ["web/*"]

# One place for the version: `lantern.__version__`.
[tool.setuptools.dynamic]
version = {attr = "lantern.__version__"}

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist", "data"]

[tool.ruff.lint]
# Real mistakes only: pycodestyle errors and warnings, pyflakes, bugbear.
# Long lines and zip() without strict= are left to the author.
select = ["E", "F", "W", "B"]
ignore = ["E501", "B905"]
